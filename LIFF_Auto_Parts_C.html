<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>AutoParts LIFF — หาอะไหล่รถยนต์</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<!-- LINE LIFF SDK -->
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; font-family: 'Sarabun', sans-serif; background: #111827; overflow-x: hidden; }
#root { min-height: 100%; display: flex; justify-content: center; }
input, select, textarea { font-family: 'Sarabun', sans-serif; }
input:focus, select:focus, textarea:focus { outline: none; }
::placeholder { color: #9ca3af; }
select option { background: #fff; color: #111; }
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">



/* ── LIFF Config ── ปรับ LIFF_ID ก่อน deploy ── */
const LIFF_ID = "YOUR_LIFF_ID"; // 👈 เปลี่ยนตรงนี้

const TWEAK_DEFAULTS = /*EDITMODE-BEGIN*/{
  "accentColor": "#1e3a8a",
  "accentLight": "#3b82f6",
  "ctaColor": "#f3a226",
  "heroStyle": "gradient"
} /*EDITMODE-END*/;

const BRANDS = ["Toyota", "Honda", "Isuzu", "Mitsubishi", "Nissan", "Mazda", "Ford", "Chevrolet", "BMW", "Mercedes-Benz", "Other / อื่นๆ"];
const YEARS = Array.from({ length: 30 }, (_, i) => (2025 - i).toString());
const MODELS = {
  Toyota: ["Hilux Revo", "Fortuner", "Camry", "Corolla Cross", "Yaris", "Vios", "Alphard"],
  Honda: ["Civic", "HR-V", "BR-V", "City", "Accord", "Jazz", "CR-V"],
  Isuzu: ["D-Max", "MU-X", "Spark"],
  Mitsubishi: ["Triton", "Pajero Sport", "Xpander", "Attrage"],
  Nissan: ["Navara", "Terra", "Almera", "Kicks"],
  Mazda: ["CX-5", "CX-3", "Mazda2", "Mazda3"],
  Ford: ["Ranger", "Everest", "Territory"],
  Chevrolet: ["Colorado", "Trailblazer"],
  BMW: ["Series 3", "Series 5", "X3", "X5"],
  "Mercedes-Benz": ["C-Class", "E-Class", "GLC", "GLE"],
  "Other / อื่นๆ": []
};

const PART_SUGGESTIONS = [
"ผ้าเบรก Brake Pad", "กรองอากาศ Air Filter", "กรองน้ำมัน Oil Filter",
"หัวเทียน Spark Plug", "โช้คอัพ Shock Absorber", "สายพาน Belt",
"แบตเตอรี่ Battery", "ไส้กรองแอร์ Cabin Filter", "ปั๊มน้ำ Water Pump"];


const Icon = ({ name, size = 20, color = "currentColor" }) => {
  const icons = {
    wrench: <path d="M14.7 6.3a1 1 0 010 1.4l-8 8a1 1 0 01-1.4-1.4l8-8a1 1 0 011.4 0zM17 4l-1 1-2-2 1-1a2 2 0 012 2zM5 19l-2 1 1-2 1 1z" stroke={color} strokeWidth="1.4" fill="none" strokeLinecap="round" strokeLinejoin="round" />,
    car: <path d="M5 11l1.5-4.5h11L19 11M3 11h18v7H3v-7zM5 18v1h2v-1m10 0v1h2v-1M7.5 14.5a1 1 0 11-2 0 1 1 0 012 0zm9 0a1 1 0 11-2 0 1 1 0 012 0z" strokeWidth="1.4" fill="none" stroke={color} strokeLinecap="round" strokeLinejoin="round" />,
    camera: <><rect x="3" y="6" width="18" height="14" rx="2" stroke={color} strokeWidth="1.4" fill="none" /><circle cx="12" cy="13" r="3.5" stroke={color} strokeWidth="1.4" fill="none" /><path d="M9 6l1.5-2h3L15 6" stroke={color} strokeWidth="1.4" fill="none" strokeLinecap="round" /></>,
    check: <path d="M5 12l4 4L19 7" stroke={color} strokeWidth="2.5" fill="none" strokeLinecap="round" strokeLinejoin="round" />,
    chevron: <path d="M6 9l6 6 6-6" stroke={color} strokeWidth="1.5" fill="none" strokeLinecap="round" strokeLinejoin="round" />,
    close: <path d="M6 6l12 12M18 6L6 18" stroke={color} strokeWidth="1.5" fill="none" strokeLinecap="round" />,
    spark: <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z" stroke={color} strokeWidth="1.4" fill="none" strokeLinecap="round" strokeLinejoin="round" />,
    arrow: <path d="M5 12h14M13 6l6 6-6 6" stroke={color} strokeWidth="1.5" fill="none" strokeLinecap="round" strokeLinejoin="round" />,
    image: <><rect x="3" y="3" width="18" height="18" rx="3" stroke={color} strokeWidth="1.4" fill="none" /><circle cx="8.5" cy="8.5" r="1.5" stroke={color} strokeWidth="1.2" fill="none" /><path d="M21 15l-5-5L5 21" stroke={color} strokeWidth="1.4" fill="none" strokeLinecap="round" strokeLinejoin="round" /></>,
    trash: <><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6" stroke={color} strokeWidth="1.4" fill="none" strokeLinecap="round" strokeLinejoin="round" /><path d="M10 11v5M14 11v5" stroke={color} strokeWidth="1.4" fill="none" strokeLinecap="round" /></>
  };
  return <svg width={size} height={size} viewBox="0 0 24 24">{icons[name]}</svg>;
};

/* ── Select with custom arrow ── */
function Select({ label, labelEn, value, onChange, children, accent }) {
  const [focused, setFocused] = React.useState(false);
  return (
    <div style={{ background: "#fff", borderRadius: 14, overflow: "hidden", position: "relative", border: "1.5px solid rgb(229, 231, 235)", transition: "border-color .2s" }}>
      <div style={{ padding: "12px 16px 4px", position: "absolute", top: 0, left: 0, pointerEvents: "none" }}>
        <span style={{ fontSize: 10, fontWeight: 700, color: "#9ca3af", letterSpacing: .8 }}>{label} · {labelEn}</span>
      </div>
      <select
        value={value}
        onChange={onChange}
        onFocus={() => setFocused(true)}
        onBlur={() => setFocused(false)}
        style={{ width: "100%", border: "none", outline: "none", background: "transparent", padding: "28px 40px 12px 16px", color: value ? "#111" : "#9ca3af", appearance: "none", cursor: "pointer", fontSize: "15px", height: "70px" }}>
        
        {children}
      </select>
      <div style={{ position: "absolute", right: 14, top: "50%", transform: "translateY(-50%)", pointerEvents: "none", color: "#9ca3af" }}>
        <Icon name="chevron" size={18} />
      </div>
    </div>);

}

/* ── Text input ── */
function Field({ label, labelEn, value, onChange, placeholder, accent, multiline }) {
  const [focused, setFocused] = React.useState(false);
  const baseStyle = { width: "100%", border: "none", outline: "none", background: "transparent", padding: "28px 16px 12px", fontSize: 15, color: "#111", resize: "none", lineHeight: 1.6 };
  return (
    <div style={{ background: "#fff", borderRadius: 14, overflow: "hidden", border: "1.5px solid rgb(229, 231, 235)", position: "relative" }}>
      <div style={{ padding: "12px 16px 4px", position: "absolute", top: 0, left: 0, pointerEvents: "none" }}>
        <span style={{ fontSize: 10, fontWeight: 700, color: "#9ca3af", letterSpacing: .8 }}>{label} · {labelEn}</span>
      </div>
      {multiline ?
      <textarea rows={3} style={{ ...baseStyle, height: "120px" }} placeholder={placeholder} value={value} onChange={onChange} onFocus={() => setFocused(true)} onBlur={() => setFocused(false)} /> :
      <input style={{ ...baseStyle, height: "70px" }} placeholder={placeholder} value={value} onChange={onChange} onFocus={() => setFocused(true)} onBlur={() => setFocused(false)} />
      }
    </div>);

}

/* ── Photo slot ── */
function PhotoSlot({ index, color, onRemove }) {
  const colors = ["#dbeafe", "#fce7f3", "#d1fae5", "#fef3c7"];
  return (
    <div style={{ width: 82, height: 82, borderRadius: 14, background: colors[index % 4], position: "relative", display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
      <div style={{ textAlign: "center" }}>
        <Icon name="image" size={22} color="#9ca3af" />
        <div style={{ fontSize: 9, color: "#9ca3af", marginTop: 3 }}>photo {index + 1}</div>
      </div>
      <button onClick={onRemove} style={{ position: "absolute", top: -6, right: -6, width: 20, height: 20, borderRadius: "50%", background: "#374151", border: "none", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center", boxShadow: "0 2px 4px rgba(0,0,0,0.2)" }}>
        <Icon name="close" size={11} color="#fff" />
      </button>
    </div>);

}

/* ══════════════════════════════════════
   MAIN APP
══════════════════════════════════════ */
function App() {
  const [tweaks] = React.useState(TWEAK_DEFAULTS);
  const accent = tweaks.accentColor;
  const accentLight = tweaks.accentLight;

  // ── LIFF state ──
  const [liffReady, setLiffReady] = React.useState(false);
  const [liffError, setLiffError] = React.useState("");
  const [profile, setProfile] = React.useState(null);
  const [sending, setSending] = React.useState(false);

  React.useEffect(() => {
    liff.init({ liffId: LIFF_ID })
      .then(async () => {
        setLiffReady(true);
        if (!liff.isLoggedIn()) {
          liff.login();
          return;
        }
        try {
          const p = await liff.getProfile();
          setProfile(p);
        } catch(e) {
          console.warn("getProfile failed:", e.message);
        }
      })
      .catch(err => {
        console.warn("LIFF init failed (preview mode):", err.message);
        setLiffReady(true);
      });
  }, []);

  const [brand, setBrand] = React.useState("");
  const [model, setModel] = React.useState("");
  const [year, setYear] = React.useState("");
  const [part, setPart] = React.useState("");
  const [note, setNote] = React.useState("");
  const [photos, setPhotos] = React.useState([]);
  const [submitted, setSubmitted] = React.useState(false);
  const [showSuggestions, setShowSuggestions] = React.useState(false);
  const [error, setError] = React.useState("");

  const heroGrad = `linear-gradient(155deg, ${accent} 0%, #111827 65%)`;

  const canSubmit = brand && year && part.trim();

  async function handleSubmit() {
    if (!canSubmit) {
      setError("กรุณากรอก ยี่ห้อ, ปีผลิต และชื่ออะไหล่ / Please fill brand, year and part name");
      return;
    }
    setError("");
    setSending(true);
    try {
      const lines = [
        `🚗 รถ: ${brand}${model ? ` ${model}` : ""} ปี ${year}`,
        `🔧 อะไหล่: ${part}`,
      ];
      if (note) lines.push(`📝 หมายเหตุ: ${note}`);
      if (photos.length > 0) lines.push(`📷 แนบรูป ${photos.length} รูป`);
      const msg = lines.join("\n");

      // userId จาก profile ที่ดึงมาตอน init
      const userId = profile ? profile.userId : null;

      // 1. ลูกค้าส่งข้อความเข้า OA inbox (ต้องเปิดจาก OA)
      if (liff.isInClient()) {
        await liff.sendMessages([{ type: "text", text: msg }]);
      }

      // 2. Bot ตอบกลับลูกค้า + แจ้ง Admin
      await fetch("https://loyal-adventure-production.up.railway.app/submit", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ brand, model, year, part, note, photos: photos.length, userId })
      });

    } catch (e) {
      console.warn("Error:", e.message);
    }
    setSending(false);
    setSubmitted(true);
  }

  function reset() {
    setBrand("");setModel("");setYear("");setPart("");setNote("");setPhotos([]);setSubmitted(false);setError("");
  }

  if (submitted) return (
    <div style={{ width: "100%", maxWidth: 430, minHeight: "100vh", background: "#111827", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", padding: "32px 20px", textAlign: "center" }}>
      {/* Success ring */}
      <div style={{ width: 100, height: 100, borderRadius: "50%", background: `linear-gradient(135deg,${accentLight},${accent})`, display: "flex", alignItems: "center", justifyContent: "center", marginBottom: 24, boxShadow: `0 0 0 12px ${accent}22` }}>
        <Icon name="check" size={44} color="#fff" />
      </div>
      <div style={{ fontSize: 24, fontWeight: 700, color: "#fff", marginBottom: 6 }}>ส่งคำขอเรียบร้อย!</div>
      <div style={{ fontSize: 14, color: "#6b7280", marginBottom: 28 }}>Request Submitted Successfully</div>

      {/* Summary card */}
      <div style={{ background: "#1f2937", borderRadius: 18, padding: "20px", width: "100%", marginBottom: 28, textAlign: "left" }}>
        <div style={{ fontSize: 11, fontWeight: 700, color: "#6b7280", letterSpacing: 1, marginBottom: 12, textTransform: "uppercase" }}>สรุปคำขอ · Summary</div>
        <div style={{ display: "flex", flexDirection: "column", gap: 10 }}>
          <div style={{ display: "flex", gap: 12, alignItems: "center" }}>
            <div style={{ width: 32, height: 32, borderRadius: 8, background: `${accent}33`, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
              <Icon name="car" size={16} color={accentLight} />
            </div>
            <div>
              <div style={{ fontSize: 11, color: "#6b7280" }}>รถยนต์ · Vehicle</div>
              <div style={{ fontSize: 15, color: "#fff", fontWeight: 600 }}>{brand}{model ? ` ${model}` : ""} — ปี {year}</div>
            </div>
          </div>
          <div style={{ height: 1, background: "#374151" }} />
          <div style={{ display: "flex", gap: 12, alignItems: "center" }}>
            <div style={{ width: 32, height: 32, borderRadius: 8, background: `${accent}33`, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
              <Icon name="wrench" size={16} color={accentLight} />
            </div>
            <div>
              <div style={{ fontSize: 11, color: "#6b7280" }}>อะไหล่ · Part</div>
              <div style={{ fontSize: 15, color: "#fff", fontWeight: 600 }}>{part}</div>
              {note && <div style={{ fontSize: 12, color: "#9ca3af", marginTop: 2 }}>{note}</div>}
            </div>
          </div>
          {photos.length > 0 && <>
            <div style={{ height: 1, background: "#374151" }} />
            <div style={{ display: "flex", gap: 12, alignItems: "center" }}>
              <div style={{ width: 32, height: 32, borderRadius: 8, background: `${accent}33`, display: "flex", alignItems: "center", justifyContent: "center", flexShrink: 0 }}>
                <Icon name="camera" size={16} color={accentLight} />
              </div>
              <div>
                <div style={{ fontSize: 11, color: "#6b7280" }}>รูปถ่าย · Photos</div>
                <div style={{ fontSize: 15, color: "#fff", fontWeight: 600 }}>{photos.length} รูป</div>
              </div>
            </div>
          </>}
        </div>
      </div>

      <div style={{ fontSize: 13, color: "#4b5563", marginBottom: 24, lineHeight: 1.8 }}>
        ร้านค้าจะติดต่อกลับผ่าน LINE ภายใน<br />
        <strong style={{ color: "#9ca3af" }}>30 นาที – 2 ชั่วโมง</strong><br />
        <span style={{ fontSize: 12 }}>A shop will reply via LINE chat.</span>
      </div>

      <div style={{ display: "flex", flexDirection: "column", gap: 10, width: "100%" }}>
        {liff.isInClient && liff.isInClient() && (
          <button onClick={() => liff.closeWindow()} style={{ background: `linear-gradient(135deg,${accent},${accentLight})`, color: "#fff", border: "none", borderRadius: 14, padding: "14px 32px", fontSize: 15, fontWeight: 700, cursor: "pointer", width: "100%", letterSpacing: .3 }}>
            ปิดหน้าต่าง · Close
          </button>
        )}
        <button onClick={reset} style={{ background: "#1f2937", color: "#9ca3af", border: "none", borderRadius: 14, padding: "13px 32px", fontSize: 14, fontWeight: 500, cursor: "pointer", width: "100%" }}>
          ส่งคำขอใหม่ · New Request
        </button>
      </div>
    </div>);


  return (
    <div style={{ width: "100%", maxWidth: 430, minHeight: "100vh", background: "#f1f5f9", position: "relative", display: "flex", flexDirection: "column" }}>

      {/* ── Status Bar (LIFF feel) ── */}
      <div style={{ background: accent, padding: "10px 20px 0", display: "flex", justifyContent: "space-between", alignItems: "center" }}>
        <span style={{ color: "#fff", fontSize: 12, fontWeight: 600, opacity: .8 }}>9:41</span>
        <span style={{ color: "#fff", fontSize: 11, opacity: .8 }}>●●●</span>
      </div>

      {/* ── Hero Header ── */}
      <div style={{ background: heroGrad, padding: "14px 20px 40px", color: "#fff", position: "relative", overflow: "hidden" }}>
        {/* Decorative ring */}
        <div style={{ position: "absolute", right: -60, top: -60, width: 220, height: 220, borderRadius: "50%", border: `1px solid rgba(255,255,255,0.06)`, pointerEvents: "none" }} />
        <div style={{ position: "absolute", right: -30, top: -30, width: 160, height: 160, borderRadius: "50%", border: `1px solid rgba(255,255,255,0.05)`, pointerEvents: "none" }} />

        <div style={{ display: "flex", alignItems: "center", gap: 10, marginBottom: 18 }}>
          <div style={{ width: 36, height: 36, borderRadius: 10, background: "rgba(255,255,255,0.15)", display: "flex", alignItems: "center", justifyContent: "center", backdropFilter: "blur(6px)", overflow: "hidden", flexShrink: 0 }}>
            {profile?.pictureUrl
              ? <img src={profile.pictureUrl} style={{ width: 36, height: 36, objectFit: "cover" }} alt=""/>
              : <Icon name="wrench" size={18} color="#fff" />}
          </div>
          <div>
            <div style={{ fontSize: 15, fontWeight: 700, lineHeight: 1.1 }}>AutoParts</div>
            <div style={{ fontSize: 11, opacity: .55, fontWeight: 300 }}>{profile ? `สวัสดี, ${profile.displayName}` : "หาอะไหล่รถยนต์"}</div>
          </div>
          <div style={{ marginLeft: "auto", background: "rgba(255,255,255,0.12)", borderRadius: 20, padding: "4px 10px", fontSize: 11, display: "flex", alignItems: "center", gap: 4 }}>
            <Icon name="spark" size={12} color="#fbbf24" /> ออนไลน์
          </div>
        </div>

        <div style={{ fontSize: 28, fontWeight: 700, lineHeight: 1.15, marginBottom: 6 }}>
          ค้นหา<br />อะไหล่รถยนต์
        </div>
        <div style={{ fontSize: 13, opacity: .55, fontWeight: 300 }}>Find auto parts · รวดเร็ว ถูกต้อง ราคาดี</div>
      </div>

      {/* ── Form Card ── */}
      <div style={{ background: "#f1f5f9", borderRadius: "22px 22px 0 0", marginTop: -20, padding: "24px 16px 20px", position: "relative", flex: 1 }}>

        {/* Section: Vehicle */}
        <div style={{ fontSize: 11, fontWeight: 700, color: "#94a3b8", letterSpacing: 1.5, textTransform: "uppercase", marginBottom: 12, display: "flex", alignItems: "center", gap: 6 }}>
          <Icon name="car" size={14} color="#94a3b8" /> ข้อมูลรถยนต์ · Vehicle Info
        </div>

        <div style={{ display: "flex", flexDirection: "column", gap: 10, marginBottom: 20 }}>
          <Select label="ยี่ห้อรถ" labelEn="Brand" value={brand} onChange={(e) => {setBrand(e.target.value);setModel("");}} accent={accent}>
            <option value="">เลือกยี่ห้อ...</option>
            {BRANDS.map((b) => <option key={b}>{b}</option>)}
          </Select>

          {brand &&
          <Select label="รุ่น" labelEn="Model" value={model} onChange={(e) => setModel(e.target.value)} accent={accent}>
              <option value="">เลือกรุ่น (ถ้าทราบ)...</option>
              {(MODELS[brand] || []).map((m) => <option key={m}>{m}</option>)}
              <option value="อื่นๆ">อื่นๆ / Other</option>
            </Select>
          }

          <Select label="ปีผลิต" labelEn="Year" value={year} onChange={(e) => setYear(e.target.value)} accent={accent}>
            <option value="">เลือกปีผลิต...</option>
            {YEARS.map((y) => <option key={y}>{y}</option>)}
          </Select>
        </div>

        {/* Section: Part */}
        <div style={{ fontSize: 11, fontWeight: 700, color: "#94a3b8", letterSpacing: 1.5, textTransform: "uppercase", marginBottom: 12, display: "flex", alignItems: "center", gap: 6 }}>
          <Icon name="wrench" size={14} color="#94a3b8" /> อะไหล่ที่ต้องการ · Parts Needed
        </div>

        <div style={{ display: "flex", flexDirection: "column", gap: 10, marginBottom: 20 }}>
          <div style={{ position: "relative" }}>
            <Field label="ชื่ออะไหล่" labelEn="Part Name" value={part}
            onChange={(e) => {setPart(e.target.value);setShowSuggestions(e.target.value.length > 0);}}
            placeholder="เช่น ผ้าเบรกหน้า, กรองอากาศ..." accent={accent} />

            {/* Suggestions */}
            {showSuggestions &&
            <div style={{ position: "absolute", top: "calc(100% + 4px)", left: 0, right: 0, background: "#fff", borderRadius: 14, boxShadow: "0 8px 24px rgba(0,0,0,0.12)", zIndex: 10, overflow: "hidden" }}>
                {PART_SUGGESTIONS.filter((s) => s.toLowerCase().includes(part.toLowerCase())).slice(0, 4).map((s) =>
              <div key={s} style={{ padding: "11px 16px", fontSize: 14, cursor: "pointer", borderBottom: "1px solid #f1f5f9", color: "#374151" }}
              onMouseDown={() => {setPart(s);setShowSuggestions(false);}}>
                    {s}
                  </div>
              )}
              </div>
            }
          </div>

          <Field label="หมายเหตุ" labelEn="Notes" value={note} onChange={(e) => setNote(e.target.value)}
          placeholder="OEM / aftermarket, งบประมาณ, ยี่ห้ออะไหล่..." accent={accent} multiline />
        </div>

        {/* Section: Photos */}
        <div style={{ fontSize: 11, fontWeight: 700, color: "#94a3b8", letterSpacing: 1.5, textTransform: "uppercase", marginBottom: 12, display: "flex", alignItems: "center", gap: 6 }}>
          <Icon name="camera" size={14} color="#94a3b8" /> รูปถ่าย · Photos
          <span style={{ fontWeight: 400, textTransform: "none", letterSpacing: 0, color: "#cbd5e1", fontSize: 11 }}>(ไม่บังคับ / optional)</span>
        </div>

        <div style={{ display: "flex", gap: 10, overflowX: "auto", paddingBottom: 4 }}>
          {photos.length < 4 &&
          <div onClick={() => setPhotos((p) => [...p, p.length])} style={{ width: 82, height: 82, borderRadius: 14, border: "2px dashed #cbd5e1", display: "flex", flexDirection: "column", alignItems: "center", justifyContent: "center", cursor: "pointer", flexShrink: 0, background: "#fff", transition: "border-color .2s" }}
          onMouseEnter={(e) => e.currentTarget.style.borderColor = accent}
          onMouseLeave={(e) => e.currentTarget.style.borderColor = "#cbd5e1"}>
              <Icon name="camera" size={22} color="#94a3b8" />
              <div style={{ fontSize: 10, color: "#94a3b8", marginTop: 4 }}>เพิ่มรูป</div>
            </div>
          }
          {photos.map((_, i) =>
          <PhotoSlot key={i} index={i} onRemove={() => setPhotos((p) => p.filter((_, j) => j !== i))} />
          )}
        </div>

        {/* Error */}
        {error &&
        <div style={{ marginTop: 16, background: "#fef2f2", border: "1px solid #fecaca", borderRadius: 12, padding: "10px 14px", fontSize: 13, color: "#b91c1c", lineHeight: 1.6 }}>
            ⚠️ {error}
          </div>
        }
      </div>

      {/* ── Sticky Submit ── */}
      <div style={{ background: "#f1f5f9", borderTop: "1px solid #e2e8f0", padding: "12px 16px 28px", marginTop: 24 }}>
        <button onClick={handleSubmit}
        style={{ width: "100%", background: canSubmit ? `linear-gradient(135deg,${accent},${accentLight})` : "#d1d5db", color: canSubmit ? "#fff" : "#9ca3af", border: "none", borderRadius: 16, padding: "16px", fontSize: 16, fontWeight: 700, cursor: canSubmit ? "pointer" : "default", letterSpacing: .3, transition: "all .2s", display: "flex", alignItems: "center", justifyContent: "center", gap: 8 }}>
          {sending ? "กำลังส่ง..." : "ส่งคำขอหาอะไหล่ · Submit"}
          {canSubmit && !sending && <Icon name="arrow" size={18} color="#fff" />}
        </button>
      </div>

    </div>);

}

/* ── Tweaks Panel ── */
function TweaksPanel({ onClose }) {
  const [accent, setAccent] = React.useState(TWEAK_DEFAULTS.accentColor);
  const [accentLight, setAccentLight] = React.useState(TWEAK_DEFAULTS.accentLight);
  const broadcast = (k, v) => {
    window.parent.postMessage({ type: '__edit_mode_set_keys', edits: { [k]: v } }, '*');
  };
  const ps = {
    panel: { position: "fixed", bottom: 24, right: 16, background: "#1f2937", borderRadius: 18, padding: "18px 18px 20px", width: 240, zIndex: 9999, boxShadow: "0 16px 40px rgba(0,0,0,0.4)", fontFamily: "Sarabun,sans-serif" },
    title: { fontSize: 13, fontWeight: 700, color: "#e5e7eb", marginBottom: 14, display: "flex", justifyContent: "space-between", alignItems: "center" },
    label: { fontSize: 11, color: "#9ca3af", fontWeight: 600, letterSpacing: .5, marginBottom: 6, display: "block" },
    row: { marginBottom: 14 },
    colorRow: { display: "flex", alignItems: "center", gap: 8 },
    colorInput: { width: 36, height: 36, border: "none", borderRadius: 8, cursor: "pointer", background: "none", padding: 0 },
    close: { width: 24, height: 24, borderRadius: "50%", background: "#374151", border: "none", cursor: "pointer", display: "flex", alignItems: "center", justifyContent: "center" }
  };
  return (
    <div style={ps.panel}>
      <div style={ps.title}>
        Tweaks
        <button style={ps.close} onClick={onClose}><Icon name="close" size={13} color="#9ca3af" /></button>
      </div>

      <div style={ps.row}>
        <span style={ps.label}>สี Accent หลัก · Primary</span>
        <div style={ps.colorRow}>
          <input type="color" style={ps.colorInput} value={accent} onChange={(e) => {setAccent(e.target.value);broadcast("accentColor", e.target.value);}} />
          <div style={{ fontSize: 12, color: "#6b7280" }}>{accent}</div>
        </div>
      </div>

      <div style={ps.row}>
        <span style={ps.label}>สี Accent รอง · Secondary</span>
        <div style={ps.colorRow}>
          <input type="color" style={ps.colorInput} value={accentLight} onChange={(e) => {setAccentLight(e.target.value);broadcast("accentLight", e.target.value);}} />
          <div style={{ fontSize: 12, color: "#6b7280" }}>{accentLight}</div>
        </div>
      </div>

      <div style={ps.row}>
        <span style={ps.label}>Preset สี</span>
        <div style={{ display: "flex", gap: 6, flexWrap: "wrap" }}>
          {[["#1e3a8a", "#3b82f6"], ["#065f46", "#10b981"], ["#7c2d12", "#f97316"], ["#4c1d95", "#8b5cf6"], ["#1e1e2e", "#6366f1"]].map(([a, b]) =>
          <div key={a} onClick={() => {setAccent(a);setAccentLight(b);broadcast("accentColor", a);broadcast("accentLight", b);}}
          style={{ width: 28, height: 28, borderRadius: 8, background: `linear-gradient(135deg,${a},${b})`, cursor: "pointer", border: accent === a ? "2px solid #fff" : "2px solid transparent" }} />
          )}
        </div>
      </div>
    </div>);

}

function Root() {
  const [showTweaks, setShowTweaks] = React.useState(false);
  React.useEffect(() => {
    window.addEventListener('message', (e) => {
      if (e.data?.type === '__activate_edit_mode') setShowTweaks(true);
      if (e.data?.type === '__deactivate_edit_mode') setShowTweaks(false);
    });
    window.parent.postMessage({ type: '__edit_mode_available' }, '*');
  }, []);
  return (
    <>
      <App />
      {showTweaks && <TweaksPanel onClose={() => {setShowTweaks(false);window.parent.postMessage({ type: '__edit_mode_dismissed' }, '*');}} />}
    </>);

}

ReactDOM.createRoot(document.getElementById('root')).render(<Root />);
</script>
</body>
</html>
